<section class="clients-section" [class.clients-section--gradient]="gradient">
    <div class="container">
        <h2 class="section-title">Partners & Clients</h2>
        <p class="section-desc" *ngIf="subtitle">{{ subtitle }}</p>
        <div class="marquee-container">
            <div class="marquee">
                <div class="marquee-content">
                    <ng-container *ngFor="let src of logos">
                        <div class="client-logo"><img [src]="src" alt="Client Logo" class="logo-img"></div>
                    </ng-container>

                    </ng-container>
