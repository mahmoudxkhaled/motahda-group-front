<div class="project-detail-content" *ngIf="project">
    <!-- Hero: Title, Description, Hero Image -->
    <section class="project-hero">
        <div class="container">
            <div class="hero-layout">
                <div class="hero-text">
                    <h1 class="project-title">{{ project.title }}</h1>
                    <div class="project-description">
                        <h3 class="description-heading">Project:</h3>
                        <p class="project-intro">{{ project.projectDescription }}</p>
                    </div>
                    <div class="company-scope">
                        <h3 class="description-heading">Company Scope:</h3>
                        <p class="scope-text">{{ project.companyScope }}</p>
                    </div>
                </div>
                <div class="hero-image">
                    <img class="image-container" [src]="project.heroImage" [alt]="project.title">
                </div>
            </div>
        </div>
    </section>


    <!-- Images Gallery -->
    <section class="project-images" *ngIf="project.images && project.images.length > 0">
        <div class="container">
            <div class="images-grid">
                <div class="image-item" *ngFor="let image of project.images">
                    <img [src]="image" [alt]="project.title + ' - Project Image'" loading="lazy">
                </div>
            </div>
        </div>
    </section>
</div>


<!-- You may also like -->
<section class="related-projects" *ngIf="related.length">
    <div class="container">
        <div class="related-header">
            <h3 class="related-title">You may also like</h3>
            <div class="title-line"></div>
        </div>
        <div class="related-grid">
            <a class="related-card" *ngFor="let item of related" [routerLink]="['/projects', item.id]">
                <div class="related-image-wrapper">
                    <img [src]="item.heroImage" [alt]="item.title" loading="lazy" />
                    <div class="related-overlay">
                        <span class="overlay-text">View Project</span>
                    </div>
                </div>
                <div class="related-info">
                    <h4 class="related-name">{{ item.title }}</h4>
                </div>
            </a>
        </div>
    </div>
</section>


<!-- Error State -->
<div class="error-state" *ngIf="error">
    <div class="error-icon">⚠️</div>
    <h2>Project Not Found</h2>
    <p>{{ error }}</p>
    <a routerLink="/projects" class="cta-button primary">Back to Projects</a>
</div>
