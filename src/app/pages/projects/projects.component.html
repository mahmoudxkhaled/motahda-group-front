<app-banner title="Projects"></app-banner>

<!-- Projects Listing Section -->
<section class="projects-listing">
    <div class="container">
        <div class="projects-grid">
            <div class="project-card" *ngFor="let project of projects">
                <div class="project-content">
                    <div class="project-text">
                        <h2 class="project-title">
                            <a [routerLink]="['/projects', project.id]">{{ project.title }}</a>
                        </h2>
                        <p class="project-description">{{ project.description }}</p>
                        <div class="project-actions" style="margin-top: 1.5rem;">
                            <a class="cta-button" [routerLink]="['/projects', project.id]">Read more →</a>
                        </div>
                    </div>
                    <div class="project-image">
                        <a [routerLink]="['/projects', project.id]">
                            <img [src]="project.heroImage" [alt]="project.title">
                        </a>
                    </div>
                </div>
                <div class="project-gallery">
                    <div class="gallery-item" *ngFor="let img of getProjectImages(project.id) | slice:0:4">
                        <img [src]="img" [alt]="project.title + ' - Gallery Image'">
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
